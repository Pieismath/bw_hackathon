[project]
name = "paper-replication-machine"
version = "0.1.0"
description = "Multi-agent system that replicates quantitative finance papers end-to-end with ambiguity and implementability analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pandas>=2.2,<4.0",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "fredapi>=0.5",
    "requests>=2.32",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
data = [
    "duckdb>=1.0",
]
engine = [
    "statsmodels>=0.14",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
pdf = [
    "pdfplumber>=0.11",
]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end pipeline tests that may hit disk caches",
    "slow: tests over 1s",
    "llm: tests that make live Anthropic API calls (run with -m llm)",
]
